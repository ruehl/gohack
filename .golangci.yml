version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck and unused are on by default.
  enable:
    - misspell
    - unconvert

issues:
  # Report every issue, not just the first few of each kind.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - gohack
